<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Household Space</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <header id="app-header" class="topbar">
    <div class="brand"><span>Household Space</span></div>
    <button id="bell-btn" class="bell-btn" title="Уведомления">🔔<span id="bell-badge" class="badge hidden">0</span></button>
  </header>
  
  <main id="view">
    <!-- ЭКРАН ВХОДА / РЕГИСТРАЦИИ -->
    <section id="scr-login" class="screen active">
      <div class="card auth-card">
        <h1>С возвращением</h1>
        <p class="muted">Введите имя и пароль.</p>
        <label>Имя пользователя</label>
        <input id="login-name" placeholder="Например: Мама">
        <label>Пароль</label>
        <input type="password" id="login-pass" placeholder="••••••">
        <button class="btn primary block" id="btn-login">Войти</button>
        
        <div class="row-links" style="justify-content: center; margin-top: 15px;">
          <a id="to-register" style="color: #818cf8; cursor: pointer;">Нет аккаунта? Зарегистрироваться</a>
        </div>
      </div>
    </section>

    <section id="scr-register" class="screen">
      <div class="card auth-card">
        <h1>Регистрация</h1>
        <p class="muted">Придумайте имя и пароль.</p>
        <label>Имя пользователя</label>
        <input id="reg-name" placeholder="Например: Мама">
        <label>Пароль (мин. 6)</label>
        <input type="password" id="reg-pass" placeholder="••••••">
        <button class="btn primary block" id="btn-register">Создать аккаунт</button>
        <div class="row-links" style="justify-content: center; margin-top: 15px;">
          <a id="to-login" style="color: #818cf8; cursor: pointer;">Уже есть аккаунт? Войти</a>
        </div>
      </div>
    </section>

    <!-- ЭКРАН ВЫБОРА СЕМЬИ -->
    <section id="scr-family-choice" class="screen">
      <div class="card auth-card">
        <h1>Ваша семья</h1>
        <p class="muted">Создайте новую или присоединитесь по коду</p>
        <button class="btn primary block" id="btn-create-family">➕ Создать семью</button>
        <div class="divider"><span>или</span></div>
        <label>Секретный код семьи</label>
        <input id="join-family-id" placeholder="Вставьте код">
        <button class="btn secondary block" id="btn-join-family">Присоединиться</button>
        <button class="btn ghost block mt" id="btn-logout">Выйти</button>
      </div>
    </section>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <section id="scr-home" class="screen">
      <nav class="tabs">
        <button class="tab active" data-tab="tables">Таблицы</button>
        <button class="tab" data-tab="family">Семья</button>
      </nav>
      
      <div id="tab-tables" class="tabpane active">
        <div class="pane-head"><h2>Мои таблицы</h2><button class="btn primary round" id="btn-new-table">＋</button></div>
        <div id="tables-container" class="stack"></div>
      </div>

      <div id="tab-family" class="tabpane">
        <div class="pane-head"><h2>Семья</h2></div>
        <div class="card">
          <div class="fam-name" id="fam-name-label">—</div>
          <div class="muted small">Код семьи: <code id="fam-id-label">—</code></div>
        </div>
        <h3 class="sub">Участники</h3>
        <div id="members-container" class="stack"></div>
        <button class="btn ghost block" id="btn-logout2" style="margin-top: 15px;">Выйти из аккаунта</button>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
