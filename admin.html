<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка Firebase</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    .wrap { max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    label { display: block; font-size: .82rem; color: #94a3b8; margin: 8px 0 4px; }
    input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #273449; color: #fff; margin-bottom: 10px; box-sizing: border-box; }
    button { background: #6366f1; color: #fff; border: 0; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .toast { background: #ef4444; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; text-align: center; }
    .success { background: #22c55e !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔧 Админка (Firebase)</h1>
    
    <!-- Уведомление -->
    <div id="toast" class="toast"></div>
    
    <div class="card">
      <label>Имя (логин)</label>
      <input id="name" placeholder="Например: Мама">
      <label>Пароль (мин. 6)</label>
      <input id="password" type="text" placeholder="••••••">
      <button id="btn">Создать аккаунт</button>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // ВСТАВЬ СЮДА СВОЙ firebaseConfig ИЗ ПАНЕЛИ FIREBASE
    // (Project Settings → General → Your apps → SDK setup and configuration)
    // ============================================================
    const firebaseConfig = {
  apiKey: "AIzaSyBa_b7A-UYhNh8jFhefJWIV0m57nTkqrzk",
  authDomain: "household-space.firebaseapp.com",
  projectId: "household-space",
  storageBucket: "household-space.firebasestorage.app",
  messagingSenderId: "471755254217",
  appId: "1:471755254217:web:d1bda855b262144f992018"
  };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    const $ = (id) => document.getElementById(id);
    const toastEl = $("toast");
    
    function showToast(msg, isSuccess = false) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      toastEl.className = isSuccess ? "toast success" : "toast";
      setTimeout(() => { toastEl.style.display = "none"; }, 4000);
    }

    $("btn").onclick = async () => {
      const name = $("name").value.trim();
      const password = $("password").value;
      
      if (!name || !password) return showToast("Заполните все поля");
      if (password.length < 6) return showToast("Пароль должен быть минимум 6 символов");

      $("btn").disabled = true;
      $("btn").textContent = "Создание...";

      try {
        // Firebase требует email, поэтому мы делаем его из имени
        const safeName = name.toLowerCase().replace(/[^a-zа-я0-9]/gi, '');
        const email = `${safeName}@family.local`;
        
        // Создаем пользователя
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        // Сохраняем оригинальное имя (с русскими буквами и пробелами) в профиль
        const { updateProfile } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
        await updateProfile(userCredential.user, { displayName: name });

        showToast("✅ Аккаунт создан", true);
        $("name").value = "";
        $("password").value = "";
      } catch (e) {
        let errMsg = e.message;
        if (e.code === 'auth/email-already-in-use') errMsg = "Это имя уже занято";
        if (e.code === 'auth/invalid-email') errMsg = "Некорректное имя (используйте буквы и цифры)";
        showToast("❌ " + errMsg);
      } finally {
        $("btn").disabled = false;
        $("btn").textContent = "Создать аккаунт";
      }
    };
  </script>
</body>
</html>
